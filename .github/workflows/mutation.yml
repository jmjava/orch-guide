# Mutation: PIT on this module, bounded to the ingestion result types.
# IngestionResult and IngestionFailure are compiled here and are not already
# gated. They have arithmetic and conditionals the unit tests can kill.
# Every mutant must be killed. There is no survived ceiling to raise.
# This workflow does not refresh the detekt or SpotBugs baselines and does
# not run on mvn test. Codecov upload stays on the build workflow.
name: Mutation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pit:
    name: orch-guide module mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Configure Maven Settings
        uses: s4u/maven-settings-action@v2.8.0
        with:
          servers: ${{ secrets.EMBABEL_ARTIFACTORY }}

      - name: Mutation gate proving test
        run: |
          chmod +x scripts/pit-mutation.sh scripts/pit-mutation-assert.sh
          ./scripts/pit-mutation-assert.sh

      - name: PIT on this module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_DUMMY_KEY }}
        run: ./scripts/pit-mutation.sh
