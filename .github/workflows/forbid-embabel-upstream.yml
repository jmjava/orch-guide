name: Forbid embabel/guide push target

on:
  push:
  pull_request:

jobs:
  forbid-embabel-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require GitHub CLI (do not skip)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh missing on runner; installing so the forbid job cannot skip" >&2
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "FORBIDDEN: gh still missing after install; refuse to skip" >&2
            exit 1
          fi
          gh --version
      - name: Cursor rule must stay alwaysApply
        run: |
          # Leftover #9: deleting the rule or dropping alwaysApply is CI-red,
          # not silent. Front matter only — a body mention must not keep this green.
          chmod +x scripts/forbid-embabel-upstream.sh
          test -f .cursor/rules/no-embabel-upstream.mdc
          awk 'BEGIN{p=0} /^---[[:space:]]*$/{p++; next} p==1{print}' \
            .cursor/rules/no-embabel-upstream.mdc \
            | grep -qE '^[[:space:]]*alwaysApply:[[:space:]]*true[[:space:]]*$'
      - name: Absorption doc is fork-local (not a contribution queue)
        run: |
          # Leftover #6: posture doc is fork-local, not a contribution queue.
          # No leftover may ask to upstream. Missing/rewritten doc is CI-red.
          chmod +x scripts/forbid-embabel-upstream.sh
          test -f docs/spdd-upstream-absorption.md
          grep -q 'not an Embabel contribution queue' docs/spdd-upstream-absorption.md
          grep -q 'fork-local' docs/spdd-upstream-absorption.md
          grep -q 'No leftover may ask to upstream' docs/spdd-upstream-absorption.md
      - name: Cloud-agent env notes stay on this fork
        run: |
          # Leftover #7: Cloud Agent env notes stay on this fork.
          # Do not PR Embabel. Missing/rewritten notes are CI-red.
          chmod +x scripts/forbid-embabel-upstream.sh
          test -f docs/cloud-agent-env.md
          grep -q 'Cloud-agent env notes stay on this fork' docs/cloud-agent-env.md
          grep -q 'fork-local' docs/cloud-agent-env.md
          grep -q 'Do not PR Embabel' docs/cloud-agent-env.md
      - name: Layer B leftover for Embabel is refused
        run: |
          # Leftover #10: do not treat FEAT/absorption/"clean Layer B" as an
          # Embabel merge request. Leftover #6/#7 docs stay.
          chmod +x scripts/forbid-embabel-upstream.sh
          test -f docs/spdd-upstream-absorption.md
          test -f docs/cloud-agent-env.md
          grep -qiE 'Do not open PRs to .embabel/guide. \(small or large\)' \
            docs/spdd-upstream-absorption.md
          grep -qiE 'Any leftover that cleans a Layer B branch for Embabel is refused' \
            docs/spdd-upstream-absorption.md
          grep -qiE 'Do not treat FEAT work, absorption docs, or .clean Layer B branches. as a path to an Embabel merge request' \
            docs/spdd-upstream-absorption.md
          if ./scripts/forbid-embabel-upstream.sh --leftover-text \
               "Clean a Layer B branch for Embabel"; then
            echo "expected leftover that cleans a Layer B branch for Embabel to be refused" >&2
            exit 1
          fi
          if ./scripts/forbid-embabel-upstream.sh --leftover-text \
               "Open an Embabel PR"; then
            echo "expected leftover that opens an Embabel PR to be refused" >&2
            exit 1
          fi
          if ./scripts/forbid-embabel-upstream.sh --leftover-text \
               "Contribute absorption to Embabel"; then
            echo "expected leftover that contributes absorption to be refused" >&2
            exit 1
          fi
      - name: Prove default/push URL embabel/guide fails
        run: |
          chmod +x scripts/forbid-embabel-upstream.sh
          ./scripts/forbid-embabel-upstream.sh --self-test
      - name: Refuse embabel/guide as a push destination
        run: |
          # Leftover #9: missing rule / dropped alwaysApply is proven inside
          # --self-test (job stays red).
          # Leftover #10: leftover that cleans a Layer B branch for Embabel,
          # opens an Embabel PR, or contributes absorption is refused.
          # CI checkout has only origin (jmjava/orch-guide). Still run the guard.
          ./scripts/forbid-embabel-upstream.sh
          # Simulate a forbidden push URL — must fail.
          if ./scripts/forbid-embabel-upstream.sh --pre-push evil https://github.com/embabel/guide.git; then
            echo "expected forbid script to fail for embabel/guide push URL" >&2
            exit 1
          fi
          echo "negative check OK"

          # Typical clone leftover: upstream fetch == push == Embabel.
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" remote add upstream https://github.com/embabel/guide.git
          if FORBID_GIT_ROOT="$tmp" ./scripts/forbid-embabel-upstream.sh; then
            echo "expected forbid script to fail when upstream can push to embabel/guide" >&2
            exit 1
          fi
          echo "default-push-url-fails OK"

          FORBID_GIT_ROOT="$tmp" FORBID_GH_DEFAULT=jmjava/orch-guide ./scripts/forbid-embabel-upstream.sh --fix
          FORBID_GIT_ROOT="$tmp" FORBID_GH_DEFAULT=jmjava/orch-guide ./scripts/forbid-embabel-upstream.sh
          fetch_url="$(git -C "$tmp" remote get-url upstream)"
          push_url="$(git -C "$tmp" remote get-url --push upstream)"
          case "$fetch_url" in
            *embabel/guide*) ;;
            *)
              echo "expected fetch URL to stay embabel/guide after --fix, got: $fetch_url" >&2
              exit 1
              ;;
          esac
          echo "fix-keeps-fetch OK"
          if [ "$push_url" != "DISABLED" ]; then
            echo "expected push URL DISABLED after --fix, got: $push_url" >&2
            exit 1
          fi
          echo "fix-disables-push OK"
