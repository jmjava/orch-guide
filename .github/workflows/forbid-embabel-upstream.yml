name: Forbid embabel/guide push target

on:
  push:
  pull_request:

jobs:
  forbid-embabel-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require GitHub CLI (do not skip)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh missing on runner; installing so the forbid job cannot skip" >&2
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "FORBIDDEN: gh still missing after install; refuse to skip" >&2
            exit 1
          fi
          gh --version
      - name: Prove default/push URL embabel/guide fails
        run: |
          chmod +x scripts/forbid-embabel-upstream.sh
          ./scripts/forbid-embabel-upstream.sh --self-test
      - name: Refuse embabel/guide as a push destination
        run: |
          # CI checkout has only origin (jmjava/orch-guide). Still run the guard.
          ./scripts/forbid-embabel-upstream.sh
          # Simulate a forbidden push URL — must fail.
          if ./scripts/forbid-embabel-upstream.sh --pre-push evil https://github.com/embabel/guide.git; then
            echo "expected forbid script to fail for embabel/guide push URL" >&2
            exit 1
          fi
          echo "negative check OK"

          # Typical clone leftover: upstream fetch == push == Embabel.
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" remote add upstream https://github.com/embabel/guide.git
          if FORBID_GIT_ROOT="$tmp" ./scripts/forbid-embabel-upstream.sh; then
            echo "expected forbid script to fail when upstream can push to embabel/guide" >&2
            exit 1
          fi
          echo "default-push-url-fails OK"

          FORBID_GIT_ROOT="$tmp" FORBID_GH_DEFAULT=jmjava/orch-guide ./scripts/forbid-embabel-upstream.sh --fix
          FORBID_GIT_ROOT="$tmp" FORBID_GH_DEFAULT=jmjava/orch-guide ./scripts/forbid-embabel-upstream.sh
          fetch_url="$(git -C "$tmp" remote get-url upstream)"
          push_url="$(git -C "$tmp" remote get-url --push upstream)"
          case "$fetch_url" in
            *embabel/guide*) ;;
            *)
              echo "expected fetch URL to stay embabel/guide after --fix, got: $fetch_url" >&2
              exit 1
              ;;
          esac
          echo "fix-keeps-fetch OK"
          if [ "$push_url" != "DISABLED" ]; then
            echo "expected push URL DISABLED after --fix, got: $push_url" >&2
            exit 1
          fi
          echo "fix-disables-push OK"
